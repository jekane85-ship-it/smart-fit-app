name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate clean project structure
        run: |
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart
          flutter create . --project-name smart_fit_app --platforms=android --overwrite
          cp /tmp/backup/main.dart lib/main.dart

      - name: Verify Flutter project
        run: flutter analyze || true

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFit-APK
          path: build/app/outputs/flutter-apk/app-release.apk
