name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную по кнопке

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android project scaffolding
        run: |
          # Создает недостающие системные папки Android вокруг lib/main.dart
          flutter create . --platforms=android --org=com.fitcoach.app

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --split-per-abi --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFit-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
